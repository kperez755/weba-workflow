<style>
  :root { --bg:#f5f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6; --accent:#1f5f8b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px; display:grid; grid-template-columns: 440px 1fr; gap: 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  section { background: var(--card); border:1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  label { display:block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=date] { width:100%; padding: 8px 10px; border:1px solid var(--line); border-radius: 6px; font: inherit; color: inherit; background:#fff; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display:flex; gap: 6px; }
  .seg label { flex:1; margin:0; color: var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; text-align:center; cursor:pointer; font-size:14px; }
  .seg input { display:none; }
  .seg input:checked + span { font-weight:600; }
  .seg label:has(input:checked) { border-color: var(--accent); background:#eaf2f8; }
  table { width:100%; border-collapse: collapse; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:500; padding: 0 4px 4px; }
  td { padding: 3px 4px; }
  td input { width:100%; padding: 7px 8px; border:1px solid var(--line); border-radius:6px; font: inherit; }
  td.amt input { text-align:right; font-variant-numeric: tabular-nums; }
  .x { border:0; background:none; color:var(--muted); cursor:pointer; font-size:18px; padding: 0 6px; }
  .x:hover { color:#b42318; }
  .total { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .total strong { font-size: 22px; font-variant-numeric: tabular-nums; }
  button.btn { font: inherit; padding: 9px 14px; border-radius: 6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background: var(--accent); color:#fff; border-color: var(--accent); font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap: wrap; }
  .check { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; margin-top: 12px; }
  .only-cond { }
  .hidden { display:none !important; }
  .preview { position: sticky; top: 16px; height: calc(100vh - 48px); background: #e4e4df; border:1px solid var(--line); border-radius: 8px; overflow:auto; padding: 16px; }
  .preview canvas { display:block; width:100%; height:auto; background:#fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); margin: 0 auto 16px; }
  .err { color:#b42318; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Waiver Filler</h1>
    <p class="sub">Enter invoices, and the total goes onto the $ line. The bottom (signature and notary) stays blank for the sub to fill out.</p>

    <section>
      <h2>Form</h2>
      <div class="seg">
        <label><input type="radio" name="kind" value="conditional" checked><span>Conditional</span></label>
        <label><input type="radio" name="kind" value="unconditional"><span>Unconditional</span></label>
        <label><input type="radio" name="kind" value="both"><span>Both</span></label>
      </div>
    </section>

    <section>
      <h2>Invoices</h2>
      <table>
        <thead><tr><th style="width:50%">Invoice #</th><th>Amount ($)</th><th></th></tr></thead>
        <tbody id="inv"></tbody>
      </table>
      <div class="row" style="margin-top:8px"><button class="btn" id="add">+ Add invoice</button></div>
      <div class="total"><span>Total on $ line</span><strong id="total">$0.00</strong></div>
      <label class="check"><input type="checkbox" id="list" checked> Print invoice list with total at the bottom of the page</label>
    </section>

    <section>
      <h2>Top of form</h2>
      <label for="project">Project</label><input type="text" id="project">
      <label for="job">Job No.</label><input type="text" id="job">
      <div class="only-cond">
        <label for="from">Payment from</label><input type="text" id="from">
        <label for="payto">Payable to</label><input type="text" id="payto">
      </div>
      <label for="loc">Project located at</label><input type="text" id="loc">
      <label for="thru">Work furnished through (date)</label><input type="date" id="thru">
    </section>

    <section>
      <h2>Bottom of form (optional, leave blank for the sub)</h2>
      <label for="date">Date</label><input type="date" id="date">
      <label for="company">Company name</label><input type="text" id="company">
      <label for="title">Title</label><input type="text" id="titleF">
    </section>

    <div class="row">
      <button class="btn primary" id="dl">Download PDF</button>
      <button class="btn" id="clear">Clear</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="preview" id="pv" aria-label="Preview"></div>
</main>

// Line positions, measured from the PDFs (points from top-left; x0..x1 is the blank line).
const LAYOUT = {
  conditional: {
    project: [105, 495, 93], job: [105, 531, 117],
    from: [316, 460, 157.4], amount: [68, 148, 172.6], payto: [198, 425, 172.6],
    loc: [405, 505, 232.4], thru: [234, 425, 262],
    date: [90, 226, 425.2], company: [243, 534, 425.2], title: [268, 533, 509],
    listTop: 650,
  },
  unconditional: {
    project: [127, 553, 101.6], job: [122, 553, 126],
    amount: [85, 214, 176.9],
    loc: [100, 210, 191.9], thru: [85, 214, 267.6],
    date: [109, 267, 421.6], company: [277, 555, 421.6], title: [298, 558, 505],
    listTop: 650,
  },
};

const $ = id => document.getElementById(id);
const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parseAmt = s => { const n = parseFloat(String(s).replace(/[$,\s]/g, '')); return isFinite(n) ? n : 0; };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${+m}/${+d}/${y}`; };

function addRow(num = '', amt = '') {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input type="text" class="num" placeholder="e.g. 1042"></td>
    <td class="amt"><input type="text" inputmode="decimal" class="amt" placeholder="0.00"></td>
    <td><button class="x" title="Remove">&times;</button></td>`;
  tr.querySelector('.num').value = num;
  tr.querySelector('input.amt').value = amt;
  tr.querySelector('.x').onclick = () => { tr.remove(); if (!$('inv').children.length) addRow(); refresh(); };
  tr.querySelector('input.amt').addEventListener('blur', e => { if (e.target.value.trim()) e.target.value = money(parseAmt(e.target.value)); });
  tr.querySelector('input.amt').addEventListener('keydown', e => { if (e.key === 'Enter') { addRow(); $('inv').lastElementChild.querySelector('.num').focus(); } });
  $('inv').appendChild(tr);
}

function invoices() {
  return [...$('inv').children].map(tr => ({
    num: tr.querySelector('.num').value.trim(),
    amt: parseAmt(tr.querySelector('input.amt').value),
    raw: tr.querySelector('input.amt').value.trim(),
  })).filter(r => r.num || r.raw);
}

function kinds() {
  const k = document.querySelector('input[name=kind]:checked').value;
  return k === 'both' ? ['conditional', 'unconditional'] : [k];
}

function b64ToBytes(b64) { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

// Helvetica measurements, used to shrink text so it fits on its line.
let fonts;
async function getFonts() {
  if (!fonts) {
    const d = await PDFLib.PDFDocument.create();
    fonts = { reg: await d.embedFont(PDFLib.StandardFonts.Helvetica), bold: await d.embedFont(PDFLib.StandardFonts.HelveticaBold) };
  }
  return fonts;
}

// Everything to write on one form, as a list of text pieces and lines.
// Positions are in points from the top-left; "top" is the text baseline.
// Both the PDF and the on-screen preview are drawn from this list.
function pageOps(k, F) {
  const inv = invoices();
  const total = Math.round(inv.reduce((s, r) => s + r.amt, 0) * 100) / 100;
  const v = {
    project: $('project').value, job: $('job').value, from: $('from').value, payto: $('payto').value,
    loc: $('loc').value, thru: fmtDate($('thru').value), amount: inv.length ? money(total) : '',
    date: fmtDate($('date').value), company: $('company').value, title: $('titleF').value,
  };
  const L = LAYOUT[k];
  const ops = [];
  const text = (s, x, top, size, bold = false) => ops.push({ text: s, x, top, size, bold });
  const width = (s, size, bold) => (bold ? F.bold : F.reg).widthOfTextAtSize(s, size);

  // Write text on a blank line, shrinking it if it would run past the line.
  const put = (key, bold = false) => {
    const s = v[key]; const pos = L[key];
    if (!s || !pos) return;
    const [x0, x1, top] = pos;
    let size = 10;
    while (size > 6 && width(s, size, bold) > x1 - x0 - 4) size -= 0.5;
    text(s, x0 + 3, top - 2.5, size, bold);
  };
  ['project', 'job', 'from', 'payto', 'loc', 'thru', 'date', 'company', 'title'].forEach(key => put(key));
  put('amount', true);

  if ($('list').checked && inv.length) {
    const x = 98, xr = 330; let top = L.listTop;
    const rows = inv.length;
    const lh = rows > 8 ? Math.max(7, 90 / (rows + 2)) : 11;
    const size = Math.min(9, lh - 1.5);
    text('Invoices included in this payment', x, top, size, true); top += lh;
    for (const r of inv) {
      text(r.num ? `Invoice #${r.num}` : 'Invoice', x + 6, top, size);
      const s = '$' + money(r.amt);
      text(s, xr - width(s, size), top, size);
      top += lh;
    }
    ops.push({ line: [x + 6, xr, top - lh + 3] });
    text('Total', x + 6, top + 1, size, true);
    const s = '$' + money(total);
    text(s, xr - width(s, size, true), top + 1, size, true);
  }
  return ops;
}

async function build() {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const F = await getFonts();
  const out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.Helvetica);
  const bold = await out.embedFont(StandardFonts.HelveticaBold);

  for (const k of kinds()) {
    const src = await PDFDocument.load(b64ToBytes(PDFS[k]));
    const [page] = await out.copyPages(src, [0]);
    out.addPage(page);
    const H = page.getHeight();
    for (const op of pageOps(k, F)) {
      if (op.line) page.drawLine({ start: { x: op.line[0], y: H - op.line[2] }, end: { x: op.line[1], y: H - op.line[2] }, thickness: 0.5 });
      else page.drawText(op.text, { x: op.x, y: H - op.top, size: op.size, font: op.bold ? bold : font, color: rgb(0, 0, 0) });
    }
  }
  return out.save();
}

// The preview is drawn by the page itself (form image + text), not the browser's
// PDF viewer, so it still works on work computers where that viewer is locked down.
const formImages = {};
function formImage(k) {
  if (!formImages[k]) {
    formImages[k] = new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = PREVIEWS[k]; });
  }
  return formImages[k];
}

async function drawPreview() {
  const F = await getFonts();
  const canvases = [];
  for (const k of kinds()) {
    const img = await formImage(k);
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    const s = img.width / 612;
    ctx.drawImage(img, 0, 0);
    ctx.fillStyle = ctx.strokeStyle = '#000';
    for (const op of pageOps(k, F)) {
      if (op.line) { ctx.lineWidth = 0.5 * s; ctx.beginPath(); ctx.moveTo(op.line[0] * s, op.line[2] * s); ctx.lineTo(op.line[1] * s, op.line[2] * s); ctx.stroke(); }
      else { ctx.font = `${op.bold ? 'bold ' : ''}${op.size * s}px Helvetica, Arial, sans-serif`; ctx.fillText(op.text, op.x * s, op.top * s); }
    }
    canvases.push(c);
  }
  $('pv').replaceChildren(...canvases);
}

let timer;
async function refresh() {
  const inv = invoices();
  $('total').textContent = '$' + money(inv.reduce((s, r) => s + r.amt, 0));
  const onlyUncond = kinds().length === 1 && kinds()[0] === 'unconditional';
  document.querySelector('.only-cond').classList.toggle('hidden', onlyUncond);
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      await drawPreview();
      $('err').textContent = '';
    } catch (e) { $('err').textContent = 'Could not draw the preview: ' + e.message; }
  }, 150);
}

async function download() {
  if (typeof PDFLib === 'undefined') { $('err').textContent = 'The PDF library did not load. Try reopening this page.'; return; }
  const bytes = await build();
  const names = { conditional: 'Conditional Waiver', unconditional: 'Unconditional Waiver' };
  const nums = invoices().map(r => r.num).filter(Boolean);
  const k = kinds();
  let name = k.length === 2 ? 'Waivers' : names[k[0]];
  if ($('project').value.trim()) name += ' - ' + $('project').value.trim();
  if (nums.length) name += ' - Inv ' + nums.join(', ');
  name = name.replace(/[^\w\s.,()&-]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120) + '.pdf';
  const blob = new Blob([bytes], { type: 'application/pdf' });

  // Chrome/Edge: open a real "Save As" box that only saves as PDF.
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'PDF document', accept: { 'application/pdf': ['.pdf'] } }],
      });
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // user hit Cancel
    }
  }

  // Other browsers: normal download. The link has to be on the page and the
  // URL kept alive for a moment, or some browsers drop the file name.
  const file = new File([blob], name, { type: 'application/pdf' });
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

$('add').onclick = () => { addRow(); $('inv').lastElementChild.querySelector('.num').focus(); };
$('dl').onclick = download;
$('clear').onclick = () => {
  document.querySelectorAll('input[type=text], input[type=date]').forEach(i => i.value = '');
  $('inv').innerHTML = ''; addRow(); refresh();
};
document.addEventListener('input', refresh);
document.addEventListener('change', refresh);
addRow();
window.addEventListener('load', () => {
  if (typeof PDFLib === 'undefined') { $('err').textContent = 'The PDF library did not load. Try reopening this page.'; return; }
  refresh();
});
</script>
